name: Release

# Cut a release by pushing a version tag:
#   git tag -a v1.8.0 -m "News Curator 1.8.0" && git push origin main --follow-tags
# The workflow refuses to publish when the tag and metadata.json disagree, so the tagged commit
# is always self-consistent. Products:
#   io.github.infidel.newscurator-<version>.plasmoid  -> upload as-is to store.kde.org
#   news-curator-<version>.tar.gz                     -> full install (widget + backend)
#   SHA256SUMS
#
# All packaging logic lives in scripts/; run `./scripts/ci-local.sh` before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.8.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s backend/tests -t . -v

      - name: Check tag against metadata version
        run: python3 scripts/check-metadata.py --expect-tag "$RELEASE_TAG"

      - name: Build and verify artifacts
        run: ./scripts/ci-local.sh --skip-tests

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/check-metadata.py --print-version)
          gh release create "$RELEASE_TAG" \
            "dist/io.github.infidel.newscurator-$version.plasmoid" \
            "dist/news-curator-$version.tar.gz" \
            "dist/SHA256SUMS" \
            --title "News Curator $version" \
            --generate-notes \
            --verify-tag
